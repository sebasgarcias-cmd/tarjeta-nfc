<script>
  var WECHAT_ID = "+573043827493";
  var toast = document.getElementById("toast");
  var timer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(timer);
    timer = setTimeout(function () { toast.classList.remove("show"); }, 3500);
  }
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    var t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } finally { document.body.removeChild(t); }
    return Promise.resolve();
  }
  document.getElementById("wechat").addEventListener("click", function () {
    copy(WECHAT_ID).then(function () {
      showToast("Number copied. Paste it in WeChat search to add me.");
    }, function () {
      showToast("Search " + WECHAT_ID + " in WeChat to add me.");
    });
    // Opens the WeChat app on phones that have it installed
    if (/Android|iPhone|iPad/i.test(navigator.userAgent)) {
